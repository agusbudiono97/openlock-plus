name: CI

# Trigger a fresh run after enabling GitHub Actions on this fork.
on:
  push:
    branches: [main, feature/premium-strict-mode]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (zero tolerance)
        run: dart analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Test store build (no update requests)
        run: flutter test --dart-define=OFFLYNE_STORE=fdroid test/store_build_test.dart
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

  pin-validation:
    name: PIN screen targeted validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze PIN screen files
        run: >-
          dart analyze
          lib/src/features/auth/widgets/pin_entry_panel.dart
          lib/src/features/auth/screens/unlock_screen.dart
      - name: Run Flutter tests
        run: flutter test
